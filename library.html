<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Library</title>
  <link rel="stylesheet" href="./dist/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
  </style>
  <style>
    @font-face {
      font-family: "Aspekta Variable";
      font-weight: 100 900;
      font-display: swap;
      font-style: normal;
      src: url("./font/AspektaVF.woff2") format("woff2");
    }
  </style>
</head>
<body class="theme-light">
  <button class="btn btn--fill kit-fab" id="themeToggle">
    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-sun"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg>
  </button>
  <!-- Style -->
  <div>
    <!-- Typography -->
    <div>
      <p class="label-lg t-secondary kit-label">Desktop</p>
      <h1 class="display-lg">Display Large</h1>
      <h2 class="display-sm">Display Small</h2>
      <h3 class="headline-lg">Headline Large</h3>
      <h4 class="headline-sm">Headline Small</h4>
      <h5 class="subheadline-lg">Subheadline Large</h5>
      <h6 class="subheadline-sm">Subheadline Small</h6>
      <p class="body-lg">Body Large</p>
      <p class="body-sm">Body Small</p>
      <p class="label-lg">Label Large</p>
      <p class="label-sm">Label Small</p>
    </div>
    <!-- Colors -->
    <div></div>
    <!-- Effects -->
    <div></div>
  </div>
  <!-- Components -->
  <div>
    <!-- Buttons -->
    <div>
      <div class="kit-header">
        <h2 class="display-sm">Buttons</h2>
        <h6 class="subheadline-sm t-secondary">4 styles, 4 states inspired by <a href="#">Google Design</a>, following <a href="#">Material Design Guidelines</a>.</h6>
      </div>
      <!-- Main Buttons -->
      <div>
        <p class="label-lg t-secondary kit-label">Main Buttons</p>
        <!-- No Icon -->
        <div>
          <button class="btn btn--fill">
            <span class="body-lg">Fill Button</span>
          </button>
          <button class="btn btn--outline">
            <span class="body-lg">Outline Button</span>
          </button>
          <button class="btn btn--ghost">
            <span class="body-lg">Ghost Button</span>
          </button>
          <button class="btn btn--tonal">
            <span class="body-lg">Tonal Button</span>
          </button>
        </div>
        <!-- With Icon -->
        <div>
          <button class="btn btn--fill">
            <span class="body-lg">Fill Button</span>
            <svg  xmlns="http://www.w3.org/2000/svg"  width="18"  height="18"  viewBox="0 0 18 18"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" />
              <path d="M8 7l9 0l0 9" />
            </svg>
          </button>
          <button class="btn btn--outline">
            <span class="body-lg">Outline Button</span>
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" />
              <path d="M8 7l9 0l0 9" />
            </svg>
          </button>
          <button class="btn btn--ghost">
            <span class="body-lg">Ghost Button</span>
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" />
              <path d="M8 7l9 0l0 9" />
            </svg>
          </button>
          <button class="btn btn--tonal">
            <span class="body-lg">Tonal Button</span>
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" />
              <path d="M8 7l9 0l0 9" />
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Icon Buttons -->
      <div>
        <button class="btn icon-btn btn--fill">
          <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" />
            <path d="M8 7l9 0l0 9" />
          </svg>
        </button>
        <button class="btn icon-btn btn--outline">
          <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" /><path d="M8 7l9 0l0 9" /></svg>
        </button>
        <button class="btn icon-btn btn--ghost">
          <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" /><path d="M8 7l9 0l0 9" /></svg>
        </button>
        <button class="btn icon-btn btn--tonal">
          <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up-right"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 7l-10 10" /><path d="M8 7l9 0l0 9" /></svg>
        </button>
      </div>
      <!-- Links -->
      <div></div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
