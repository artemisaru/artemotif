<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Library</title>
  <link rel="stylesheet" href="./dist/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
  </style>
  <style>
    @font-face {
      font-family: "Aspekta Variable";
      font-weight: 100 900;
      font-display: swap;
      font-style: normal;
      src: url("./font/AspektaVF.woff2") format("woff2");
    }
  </style>
</head>
<body class="theme-light">
  <button class="btn btn--filled icon-btn--square kit-fab" id="themeToggle">
    <svg class="icon icon--lg" fill="currentColor">
      <use href="#icon-sun"></use>
    </svg>
  </button>
  <!-- Style -->
  <div>
    <!-- Typography -->
    <div>
      <p class="label-lg t-secondary kit-label">Desktop</p>
      <h1 class="display-lg">Display Large</h1>
      <h2 class="display-sm">Display Small</h2>
      <h3 class="headline-lg">Headline Large</h3>
      <h4 class="headline-sm">Headline Small</h4>
      <h5 class="subheadline-lg">Subheadline Large</h5>
      <h6 class="subheadline-sm">Subheadline Small</h6>
      <p class="body-lg">Body Large</p>
      <p class="body-sm">Body Small</p>
      <p class="label-lg">Label Large</p>
      <p class="label-sm">Label Small</p>
    </div>
    <!-- Colors -->
    <div></div>
    <!-- Effects -->
    <div></div>
  </div>
  <!-- Components -->
  <div>
    <!-- Buttons -->
    <div>
      <div class="kit-header">
        <h2 class="display-sm">Buttons</h2>
        <h6 class="subheadline-sm t-secondary">4 styles, 4 states inspired by <a href="#">Google Design</a>, following <a href="#">Material Design Guidelines</a>.</h6>
      </div>
      <!-- Main Buttons -->
      <div>
        <p class="label-lg t-secondary kit-label">Main Buttons</p>
        <!-- No Icon -->
        <div>
          <button class="btn btn--filled btn--fill">
            <span class="fill"></span>
            <span class="body-lg btn-label">Fill Button</span>
          </button>
          <button class="btn btn--outline">
            <span class="body-lg btn-label">Outline Button</span>
          </button>
          <button class="btn btn--ghost btn--cursor">
            <span class="body-lg">Ghost Button</span>
          </button>
          <button class="btn btn--tonal">
            <span class="body-lg btn-label">Tonal Button</span>
          </button>
        </div>
        <!-- With Icon -->
        <div>
          <button class="btn btn--filled">
            <span class="body-lg btn-label">Fill Button</span>
            <svg class="icon icon--sm">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--outline">
            <span class="body-lg btn-label">Outline Button</span>
            <svg class="icon icon--sm">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--ghost btn--cursor">
            <span class="body-lg btn-label">Ghost Button</span>
            <svg class="icon icon--sm">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--tonal">
            <span class="body-lg btn-label">Tonal Button</span>
            <svg class="icon icon--sm">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
        </div>
      </div>

      <!-- Icon Buttons -->
      <div>
        <p class="label-lg t-secondary kit-label">Icon Buttons</p>
        <!-- Square -->
        <div>
          <button class="btn btn--filled icon-btn--square">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--outline icon-btn--square">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--ghost icon-btn--square">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--tonal icon-btn--square">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
        </div>
        <!-- Stretched -->
        <div>
          <button class="btn btn--filled icon-btn--stretched">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--outline icon-btn--stretched">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--ghost icon-btn--stretched">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
          <button class="btn btn--tonal icon-btn--stretched">
            <svg class="icon icon--lg">
              <use href="#icon-arrow-up-right"></use>
            </svg>
          </button>
        </div>
      <!-- Links -->
      <div></div>
    </div>
  </div>
  
  <div class="custom-cursor"></div>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
