<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Library</title>
  <link rel="stylesheet" href="./dist/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
  </style>
  <style>
    @font-face {
      font-family: "Aspekta Variable";
      font-weight: 100 900;
      font-display: swap;
      font-style: normal;
      src: url("./font/AspektaVF.woff2") format("woff2");
    }
  </style>
</head>
<body class="theme-light">
  <button id="themeToggle">Toggle Theme</button>
  <div>
    <h1 class="font-primary display-lg">Display Large</h1>
    <h2 class="font-primary display-sm">Display Small</h2>
    <h3 class="font-primary headline-lg">Headline Large</h3>
    <h4 class="font-primary headline-sm">Headline Small</h4>
    <h5 class="font-primary subheadline-lg">Subheadline Large</h5>
    <h6 class="font-primary subheadline-lg">Subheadline Small</h6>
    <p class="font-primary body-lg">Body Large</p>
    <p class="font-primary body-sm">Body Small</p>
    <p class="font-primary label-lg">Label Large</p>
    <p class="font-primary label-sm">Label Small</p>
  </div>

  <script src="./main.js"></script>
</body>
</html>
